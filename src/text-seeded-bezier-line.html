  <script id="tsbl-python-template" type="text/plain">
import hashlib
import json
import math
import re
from decimal import Decimal, ROUND_HALF_UP

INPUT_TEXT = ""
OUTPUT_FILE = "signature.svg"
SETTINGS = json.loads(r'''__SETTINGS_JSON__''')


def canonical_json(value):
    return json.dumps(value, sort_keys=True, separators=(",", ":"), ensure_ascii=False)


def hash_to_unit_float(scope, parameter):
    payload = canonical_json({
        "namespace": SETTINGS["random_namespace"],
        "parameter": parameter,
        "scheme": SETTINGS["random_scheme"],
        "scope": scope,
    }).encode("utf-8")
    digest = hashlib.sha256(payload).digest()
    first_53_bits = int.from_bytes(digest[:8], "big") >> 11
    return first_53_bits / 9007199254740992


def map_range(unit_value, minimum, maximum):
    return minimum + unit_value * (maximum - minimum)


def seeded_values(characters):
    rotation_min, rotation_max = SETTINGS["handle_rotation_degrees"]
    length_min, length_max = SETTINGS["handle_length_px"]
# @block random-height
    y_min, y_max = SETTINGS["point_y_shift_px"]
# @endblock random-height
    values = []
    for character in characters:
        scope = {"kind": "character", "value": character}
        values.append({
            "angle": map_range(hash_to_unit_float(scope, "handle-angle"), rotation_min, rotation_max) * math.pi / 180,
            "incoming_length": map_range(hash_to_unit_float(scope, "incoming-handle-length"), length_min, length_max),
            "outgoing_length": map_range(hash_to_unit_float(scope, "outgoing-handle-length"), length_min, length_max),
# @block random-height
            "y_shift": map_range(hash_to_unit_float(scope, "point-y-shift"), y_min, y_max),
# @endblock random-height
        })
    return values


# @block random-distribution
def pair_gap_weight(left_character, right_character):
    minimum, maximum = SETTINGS["gap_weight_range"]
    scope = {
        "kind": "ordered-character-pair",
        "left": {"kind": "character", "value": left_character},
        "right": {"kind": "character", "value": right_character},
    }
    return map_range(hash_to_unit_float(scope, "point-gap-weight"), minimum, maximum)
# @endblock random-distribution


def smooth_handle_angles(raw):
    count = len(raw)
    result = []
    for index, value in enumerate(raw):
        previous = raw[max(0, index - 1)]["angle"]
        following = raw[min(count - 1, index + 1)]["angle"]
        result.append((previous + 2 * value["angle"] + following) / 4)
    return result


def is_uppercase(character):
    return "A" <= character <= "Z"


def is_serial_digit(character):
    return "0" <= character <= "9"


def shifted_point(point, shift_x):
    return {
        **point,
        "anchor": [point["anchor"][0] + shift_x, point["anchor"][1]],
        "incoming": [point["incoming"][0] + shift_x, point["incoming"][1]],
        "outgoing": [point["outgoing"][0] + shift_x, point["outgoing"][1]],
    }


def center_geometry(points):
    x_values = []
    for point in points:
        x_values.extend((point["anchor"][0], point["incoming"][0], point["outgoing"][0]))
    shift_x = SETTINGS["canvas_size"] / 2 - (min(x_values) + max(x_values)) / 2
    return [shifted_point(point, shift_x) for point in points]


def geometry_for(characters):
    count = len(characters)
    if count == 0:
        return []
    center = SETTINGS["canvas_size"] / 2
    raw = seeded_values(characters)
    smoothed_angles = smooth_handle_angles(raw)
    serial_flags = [is_serial_digit(character) for character in characters]
    serial_digit_count = sum(serial_flags)
    line_span = SETTINGS["line_end_x"] - SETTINGS["line_start_x"]
    target_span = line_span * count / SETTINGS["short_text_span_denominator"] if count <= 3 else line_span
    target_start = center - target_span / 2
    target_end = center + target_span / 2

    def identity_point(character, index, x):
# @block random-height
        y_shift = raw[index]["y_shift"]
# @endblock random-height
# @block flat-height
        y_shift = 0
# @endblock flat-height
        anchor = [x, center + y_shift]
        angle = smoothed_angles[index]
        direction = [math.cos(angle), math.sin(angle)]
        return {
            "character": character,
            "uppercase": is_uppercase(character),
            "serial_tail": False,
            "anchor": anchor,
            "incoming": [
                anchor[0] - direction[0] * raw[index]["incoming_length"],
                anchor[1] - direction[1] * raw[index]["incoming_length"],
            ],
            "outgoing": [
                anchor[0] + direction[0] * raw[index]["outgoing_length"],
                anchor[1] + direction[1] * raw[index]["outgoing_length"],
            ],
        }

    if serial_digit_count == 0:
        if count == 1:
            return center_geometry([
                identity_point(characters[0], 0, target_start),
                identity_point(characters[0], 0, target_end),
            ])
# @block average-distribution
        gap_weights = [1 for _ in range(count - 1)]
# @endblock average-distribution
# @block random-distribution
        gap_weights = [pair_gap_weight(characters[index], characters[index + 1]) for index in range(count - 1)]
# @endblock random-distribution
        gap_total = sum(gap_weights)
        gaps = [target_span * value / gap_total for value in gap_weights]
        positions = [target_start]
        for gap in gaps:
            positions.append(positions[-1] + gap)
        return center_geometry([identity_point(character, index, positions[index]) for index, character in enumerate(characters)])

    serial_spacing = SETTINGS["serial_spacing_px"]
    pulse_handle = serial_spacing * SETTINGS["pulse_handle_spacing_factor"]
    y_min, y_max = SETTINGS["point_y_shift_px"]
    point_y_span = y_max - y_min
    point_y_midpoint = (y_min + y_max) / 2
    serial_y_scale = point_y_span / SETTINGS["point_y_reference_span_px"]
    scaled_serial_baseline_y = (
        center
        + point_y_midpoint
        + (SETTINGS["serial_baseline_y"] - center - SETTINGS["point_y_reference_midpoint_px"]) * serial_y_scale
    )

    def serial_point(character, x, y):
        return {
            "character": character,
            "uppercase": False,
            "serial_tail": True,
            "anchor": [x, y],
            "incoming": [x - pulse_handle, y],
            "outgoing": [x + pulse_handle, y],
        }

    connector_gap = min(SETTINGS["connector_gap_max_px"], serial_spacing * SETTINGS["connector_spacing_factor"])
    flexible_boundaries = []
    transition_count = 0
    for index in range(count - 1):
        if serial_flags[index] != serial_flags[index + 1]:
            transition_count += 1
        if not serial_flags[index] and not serial_flags[index + 1]:
            flexible_boundaries.append(index)

    fixed_width = serial_digit_count * serial_spacing + transition_count * connector_gap
    flexible_span = max(0, target_span - fixed_width)
# @block average-distribution
    flexible_weights = [1 for _ in flexible_boundaries]
# @endblock average-distribution
# @block random-distribution
    flexible_weights = [pair_gap_weight(characters[index], characters[index + 1]) for index in flexible_boundaries]
# @endblock random-distribution
    flexible_total = sum(flexible_weights)
    flexible_advance = {
        boundary: flexible_span * flexible_weights[weight_index] / flexible_total if flexible_total > 0 else 0
        for weight_index, boundary in enumerate(flexible_boundaries)
    }
    used_width = fixed_width + (flexible_span if flexible_boundaries else 0)
    cursor_x = center - used_width / 2
    points = []

    for index, character in enumerate(characters):
        if serial_flags[index]:
            if index == 0 or not serial_flags[index - 1]:
                points.append(serial_point(character, cursor_x, scaled_serial_baseline_y))
            base_height = int(character) / 9 * SETTINGS["serial_maximum_pulse_height_px"]
            scaled_height = base_height * serial_y_scale
            points.append(serial_point(character, cursor_x + serial_spacing / 2, scaled_serial_baseline_y - scaled_height))
            cursor_x += serial_spacing
            points.append(serial_point(character, cursor_x, scaled_serial_baseline_y))
            if index < count - 1 and not serial_flags[index + 1]:
                cursor_x += connector_gap
        else:
            points.append(identity_point(character, index, cursor_x))
            if index < count - 1:
                cursor_x += connector_gap if serial_flags[index + 1] else flexible_advance.get(index, 0)

    return center_geometry(points)


def cubic_point(p0, p1, p2, p3, t):
    u = 1 - t
    a = u * u * u
    b = 3 * u * u * t
    c = 3 * u * t * t
    d = t * t * t
    return [
        a * p0[0] + b * p1[0] + c * p2[0] + d * p3[0],
        a * p0[1] + b * p1[1] + c * p2[1] + d * p3[1],
    ]


# @block variable-outline
def cubic_derivative(p0, p1, p2, p3, t):
    u = 1 - t
    return [
        3 * u * u * (p1[0] - p0[0]) + 6 * u * t * (p2[0] - p1[0]) + 3 * t * t * (p3[0] - p2[0]),
        3 * u * u * (p1[1] - p0[1]) + 6 * u * t * (p2[1] - p1[1]) + 3 * t * t * (p3[1] - p2[1]),
    ]


def smoothstep(t):
    return t * t * (3 - 2 * t)


def weight_at(point):
    base_weight = SETTINGS["base_weight_px"]
    if point["serial_tail"]:
        return base_weight
    if point["character"] == "_":
        return min(base_weight, SETTINGS["underscore_max_weight_px"])
    return base_weight + (SETTINGS["uppercase_extra_weight_px"] if point["uppercase"] else 0)


def width_between(current, following, t):
    return weight_at(current) + (weight_at(following) - weight_at(current)) * smoothstep(t)


def offset_point(current, following, t, side):
    position = cubic_point(current["anchor"], current["outgoing"], following["incoming"], following["anchor"], t)
    derivative = cubic_derivative(current["anchor"], current["outgoing"], following["incoming"], following["anchor"], t)
    length = math.hypot(derivative[0], derivative[1]) or 1
    normal = [-derivative[1] / length, derivative[0] / length]
    half_width = width_between(current, following, t) / 2
    return [position[0] + normal[0] * half_width * side, position[1] + normal[1] * half_width * side]


def center_points_for_outline(points):
    if len(points) < 2:
        return points
    minimum_x = math.inf
    maximum_x = -math.inf
    for index in range(len(points) - 1):
        current = points[index]
        following = points[index + 1]
        for sample in range(SETTINGS["centering_samples_per_segment"] + 1):
            t = sample / SETTINGS["centering_samples_per_segment"]
            outer = offset_point(current, following, t, 1)
            inner = offset_point(current, following, t, -1)
            minimum_x = min(minimum_x, outer[0], inner[0])
            maximum_x = max(maximum_x, outer[0], inner[0])
    shift_x = SETTINGS["canvas_size"] / 2 - (minimum_x + maximum_x) / 2
    return [shifted_point(point, shift_x) for point in points]

      function cubicPoint(p0, p1, p2, p3, t) {

        const d = t * t * t;

      function escapeXml(value) {

          .replaceAll("'", '&#x27;');

        let centeredPoints;
        let pathData;

          centeredPoints = centerPointsForCenterline(points);
          pathData = pureBezierPath(centeredPoints);
          pathElement = `<path d="${pathData}" fill="none" stroke="${settings.canvas.ink}" stroke-width="${xmlNumber(weight)}" stroke-linecap="round" stroke-linejoin="round"/>`;

          centeredPoints = centerPointsForOutline(points, weight, uppercaseExtra);
          pathData = mode === 'variable_bezier_outline'

          pathElement = `<path d="${pathData}" fill="${settings.canvas.ink}" stroke="none"/>`;
        }

        const canvas = settings.canvas;
        const canvasText = canvas.text;
        const displayedHandle = settings.input.display_prefix + sourceText;
        const textElement = `<text x="${xmlNumber(canvasText.x)}" y="${xmlNumber(canvasText.y)}" font-size="${xmlNumber(canvasText.size_px)}" font-weight="${xmlNumber(canvasText.weight)}" dominant-baseline="${canvasText.dominant_baseline}" fill="${canvas.ink}" text-anchor="${canvasText.anchor}" font-family="${escapeXml(canvasText.font_family)}">${escapeXml(displayedHandle)}</text>`;

          '1. Identify the X username of the account that authored the current request.',
          '2. Remove exactly one leading @ and preserve all remaining characters and case. Use only that username text as the identity seed; never use a display name and never invent a username.',
          '3. If the username is unavailable, ask for it. Otherwise, complete every ordered calculation phase and apply every declarative rule, formula, semantic label, and selected value below exactly.',
          '4. Maintain an internal calculation ledger for the hash values, mapped values, anchors, handles, widths, centering shifts, and final path coordinates. Do not skip directly from the username to a visual result.',
          '5. Construct the complete SVG from the calculated geometry before any rendering occurs.',
          '6. Rasterize the completed SVG directly at 420 × 420 pixels into PNG with a vector renderer. Do not use generative image synthesis or resize a bitmap.',
          '7. Return only that 420 × 420 PNG. Do not include an explanation, code, raw SVG, settings, interface, frame, or mockup.',
          '8. If exact calculation or SVG construction is unavailable, do not approximate. State that deterministic construction is unavailable.',
          '',
          '## Exact declarative specification',
          '',
          JSON.stringify(selectedSettings, null, 2),
          ''
        ].join('\n');
      }

      function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        root.appendChild(textarea);
        textarea.select();
        const copied = document.execCommand('copy');
        textarea.remove();
        if (!copied) throw new Error('Copy command was rejected');
      }

      async function writeClipboard(text) {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          fallbackCopy(text);
        }
      }

      async function copyWithFeedback(button, text, successText, resetText) {
        try {
          await writeClipboard(text);
          button.textContent = successText;
        } catch (error) {
          try {
            fallbackCopy(text);
            button.textContent = successText;
          } catch (fallbackError) {
            button.textContent = 'Copy failed';
          }
        }
        window.setTimeout(() => {
          button.textContent = resetText;
        }, 1600);
      }

      async function copyFinalSvg() {
        await copyWithFeedback(copySvgButton, standaloneFinalSvg(), 'Copied SVG code', 'Copy 01 SVG code');
      }

      async function copyGeneratorSpec() {
        await copyWithFeedback(copyGeneratorButton, pythonGeneratorSpec(), 'Copied Python art spec', 'Copy Python art spec');
      }

      async function copyNoCodeSpec() {
        await copyWithFeedback(copyNoCodeButton, noCodeGeneratorSpec(), 'Copied no-code spec', 'Copy no-code spec');
      }

      function updateDualRange(track, minimumInput, maximumInput) {
        const domainMinimum = Number(minimumInput.min);
        const domainMaximum = Number(minimumInput.max);
        const span = domainMaximum - domainMinimum;
        const start = (Number(minimumInput.value) - domainMinimum) / span * 100;
        const end = (Number(maximumInput.value) - domainMinimum) / span * 100;
        track.style.setProperty('--range-start', `${start}%`);
        track.style.setProperty('--range-end', `${end}%`);
        track.style.setProperty('--range-mid', `${(start + end) / 2}%`);
      }

      function formatDegrees(value) {
        return `${value < 0 ? '−' : ''}${Math.abs(value)}°`;
      }

      function formatSigned(value) {
        return `${value < 0 ? '−' : ''}${Math.abs(value)}`;
      }

      function draw() {
        const distribution = randomDistributionEnabled ? 'random' : 'average';
        const renderMode = pathModeSelect.value;
        const weight = Number(weightInput.value);
        const rotationMin = Number(angleMinInput.value);
        const rotationMax = Number(angleMaxInput.value);
        const handleLengthMin = Number(handleLengthMinInput.value);
        const handleLengthMax = Number(handleLengthMaxInput.value);
        const yShiftMin = Number(yShiftMinInput.value);
        const yShiftMax = Number(yShiftMaxInput.value);
        const serialMaxHeight = Number(serialMaxHeightInput.value);
        const serialBaselineY = Number(serialBaselineYInput.value);
        const serialSpacing = Number(serialSpacingInput.value);
        const uppercaseExtra = Number(uppercaseWeightInput.value);
        const textSize = Number(textSizeInput.value);
        const textWeight = Number(textWeightInput.value);
        const firstCharacters = graphemes(currentTexts[0]);
        const firstPoints = geometryFor(firstCharacters, distribution, rotationMin, rotationMax, handleLengthMin, handleLengthMax, yShiftMin, yShiftMax, randomHeightEnabled, serialMaxHeight, serialBaselineY, serialSpacing);
        const curveCount = firstPoints.length < 2 ? 0 : firstPoints.length - 1;

        textOutput.value = `${firstCharacters.length} character${firstCharacters.length === 1 ? '' : 's'}`;
        weightOutput.value = `${weight.toFixed(1)} px`;
        angleOutput.value = `${formatDegrees(rotationMin)} — ${formatDegrees(rotationMax)}`;
        handleLengthOutput.value = `${handleLengthMin} — ${handleLengthMax} px`;
        yShiftOutput.value = `${formatSigned(yShiftMin)} — ${formatSigned(yShiftMax)} px`;
        serialMaxHeightOutput.value = `${serialMaxHeight} px`;
        serialBaselineYOutput.value = `${serialBaselineY}`;
        serialSpacingOutput.value = `${serialSpacing} px`;
        updateDualRange(angleRange, angleMinInput, angleMaxInput);
        updateDualRange(handleLengthRange, handleLengthMinInput, handleLengthMaxInput);
        updateDualRange(yShiftRange, yShiftMinInput, yShiftMaxInput);
        uppercaseWeightOutput.value = `${uppercaseExtra} px`;
        textSizeOutput.value = `${textSize} px`;
        textWeightOutput.value = `${textWeight}`;
        distributionToggleButton.textContent = randomDistributionEnabled ? 'On' : 'Off';
        distributionToggleButton.setAttribute('aria-pressed', String(randomDistributionEnabled));
        heightToggleButton.textContent = randomHeightEnabled ? 'On' : 'Off';
        heightToggleButton.setAttribute('aria-pressed', String(randomHeightEnabled));
        uppercaseWeightInput.disabled = renderMode === 'pure-bezier';
        const heightState = randomHeightEnabled ? `random Y ${formatSigned(yShiftMin)}—${formatSigned(yShiftMax)} px` : 'flat Y';
        const modeState = renderMode === 'pure-bezier'
          ? `pure cubic Bézier · uniform ${weight.toFixed(1)} px stroke`
          : renderMode === 'outline-bezier'
            ? 'variable-width Bézier outline'
            : 'variable-width sampled outline';
        stateOutput.textContent = firstPoints.length < 2
          ? `01: ${firstCharacters.length} characters / need at least 2 anchors · 4 final canvases`
          : `01: ${firstCharacters.length} characters / ${firstPoints.length} anchors / ${curveCount} curve${curveCount === 1 ? '' : 's'} · ${modeState} · 4 final canvases · ${heightState} · serial pulses`;

        currentTexts.forEach((sourceText, index) => {
          const characters = graphemes(sourceText);
          const points = geometryFor(characters, distribution, rotationMin, rotationMax, handleLengthMin, handleLengthMax, yShiftMin, yShiftMax, randomHeightEnabled, serialMaxHeight, serialBaselineY, serialSpacing);
          captions[index].textContent = `@${sourceText}`;
          finalSvgs[index].setAttribute('aria-label', `Black text-seeded open Bezier line for @${sourceText} on an eggshell background`);
          drawFinal(finalSvgs[index], points, weight, uppercaseExtra, renderMode, sourceText, textSize, textWeight);
        });
      }

      textInput.addEventListener('input', () => {
        const candidate = textInput.value;
        const valid = handlePattern.test(candidate);
        textInput.setCustomValidity(valid ? '' : 'Use 1–15 letters, numbers, or underscores. Do not include @.');
        textInput.setAttribute('aria-invalid', String(!valid));
        textError.hidden = valid;
        if (!valid) {
          textOutput.value = candidate.length === 0 ? '1–15 characters' : 'Invalid handle';
          return;
        }
        currentTexts[0] = candidate;
        draw();
      });
      distributionToggleButton.addEventListener('click', () => {
        randomDistributionEnabled = !randomDistributionEnabled;
        draw();
      });
      heightToggleButton.addEventListener('click', () => {
        randomHeightEnabled = !randomHeightEnabled;
        draw();
      });
      pathModeSelect.addEventListener('change', draw);
      switchButton.addEventListener('click', () => {
        currentTexts = Array.from({ length: 4 }, (_, offset) => validPresets[(presetCursor + offset) % validPresets.length]);
        presetCursor = (presetCursor + 4) % validPresets.length;
        textInput.value = currentTexts[0];
        textInput.setCustomValidity('');
        textInput.setAttribute('aria-invalid', 'false');
        textError.hidden = true;
        draw();
      });
      copySvgButton.addEventListener('click', copyFinalSvg);
      copyGeneratorButton.addEventListener('click', copyGeneratorSpec);
      copyNoCodeButton.addEventListener('click', copyNoCodeSpec);
      angleMinInput.addEventListener('input', () => {
        if (Number(angleMinInput.value) > Number(angleMaxInput.value)) angleMinInput.value = angleMaxInput.value;
        draw();
      });
      angleMaxInput.addEventListener('input', () => {
        if (Number(angleMaxInput.value) < Number(angleMinInput.value)) angleMaxInput.value = angleMinInput.value;
        draw();
      });
      handleLengthMinInput.addEventListener('input', () => {
        if (Number(handleLengthMinInput.value) > Number(handleLengthMaxInput.value)) handleLengthMinInput.value = handleLengthMaxInput.value;
        draw();
      });
      handleLengthMaxInput.addEventListener('input', () => {
        if (Number(handleLengthMaxInput.value) < Number(handleLengthMinInput.value)) handleLengthMaxInput.value = handleLengthMinInput.value;
        draw();
      });
      yShiftMinInput.addEventListener('input', () => {
        if (Number(yShiftMinInput.value) > Number(yShiftMaxInput.value)) yShiftMinInput.value = yShiftMaxInput.value;
        draw();
      });
      yShiftMaxInput.addEventListener('input', () => {
        if (Number(yShiftMaxInput.value) < Number(yShiftMinInput.value)) yShiftMaxInput.value = yShiftMinInput.value;
        draw();
      });
      [weightInput, serialMaxHeightInput, serialBaselineYInput, serialSpacingInput, uppercaseWeightInput, textSizeInput, textWeightInput].forEach(control => control.addEventListener('input', draw));
      root.__personalField = {
        canonicalSvgForText,
        currentSettings
      };
      draw();
    })();
  </script>
</div>
