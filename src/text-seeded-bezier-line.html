        0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2

      function hashToUnitFloat(scope, parameter) {

      function seededValues(characters, rotationMin, rotationMax, handleLengthMin, handleLengthMax, yShiftMin, yShiftMax, gr0kRaw, variation) {

          const scope = { kind: 'x-handle-character', value: character };
          const incomingLength = mapRange(hashToUnitFloat(scope, 'incoming-handle-length'), handleLengthMin, handleLengthMax);
          const outgoingLength = mapRange(hashToUnitFloat(scope, 'outgoing-handle-length'), handleLengthMin, handleLengthMax);

            angleDelta: variantSigned(scope, 'handle-angle', gr0kRaw) * variation.rotationDegrees * Math.PI / 180,
            incomingLength: incomingLength * (1 + variantSigned(scope, 'incoming-handle-length', gr0kRaw) * variation.handleLengthRatio),
            outgoingLength: outgoingLength * (1 + variantSigned(scope, 'outgoing-handle-length', gr0kRaw) * variation.handleLengthRatio),

          left: { kind: 'x-handle-character', value: leftCharacter },
          right: { kind: 'x-handle-character', value: rightCharacter }
        };

        const raw = seededValues(characters, rotationMin, rotationMax, handleLengthMin, handleLengthMax, yShiftMin, yShiftMax, gr0kRaw, variation);

        const lineStart = 60;
        const lineEnd = 360;

        const targetEnd = center + targetSpan / 2;

          const direction = [Math.cos(angle), Math.sin(angle)];

            character,
            uppercase: isUppercase(character),
            serialTail: false,
            anchor,
            incoming: [anchor[0] - direction[0] * raw[index].incomingLength, anchor[1] - direction[1] * raw[index].incomingLength],
            outgoing: [anchor[0] + direction[0] * raw[index].outgoingLength, anchor[1] + direction[1] * raw[index].outgoingLength]

            ...point,
            anchor: [point.anchor[0] + shiftX, point.anchor[1]],
            incoming: [point.incoming[0] + shiftX, point.incoming[1]],
            outgoing: [point.outgoing[0] + shiftX, point.outgoing[1]]

            ]);

          const gapTotal = gapWeights.reduce((total, value) => total + value, 0);

          const canonicalRunShift = useRandomHeight
            ? mapRange(hashToUnitFloat(runScope, 'point-y-shift'), yShiftMin, yShiftMax)
            : 0;
          const runShift = canonicalRunShift
            + variantSigned(runScope, 'point-y-shift', gr0kRaw) * variation.serialYPx;
          for (let runIndex = index; runIndex < endIndex; runIndex++) {

          }
          index = endIndex;
        }

        const serialPoint = (character, x, y, incomingHandle, outgoingHandle) => ({
          character,
          uppercase: false,
          serialTail: true,
          anchor: [x, y],
          incoming: [x - incomingHandle, y],
          outgoing: [x + outgoingHandle, y]
        });

        const transitionBoundaries = [];

      function cubicPoint(p0, p1, p2, p3, t) {

          anchor: [point.anchor[0] + shiftX, point.anchor[1]],

          const next = points[index + 1];
          const start = offsetPoint(current, next, 0, 1, baseWeight, uppercaseExtra);
          const oneThird = offsetPoint(current, next, 1 / 3, 1, baseWeight, uppercaseExtra);

          const next = points[index + 1];

          const oneThird = offsetPoint(current, next, 1 / 3, -1, baseWeight, uppercaseExtra);
          const twoThirds = offsetPoint(current, next, 2 / 3, -1, baseWeight, uppercaseExtra);

            height: 420,

            ink: '#11110f',
            text: {
              x: 210,
              y: 399,
              size_px: Number(textSizeInput.value),
              weight: Number(textWeightInput.value),
              anchor: 'middle',
              dominant_baseline: 'middle',
              font_family: '-apple-system, system-ui, Segoe UI, sans-serif'

          geometry: {
            point_distribution: randomDistributionEnabled ? 'random' : 'average',
            random_point_height: randomHeightEnabled,
            line_start_x: 60,
            line_end_x: 360,
            short_text_span_denominator: 4,
            gap_weight_range: [.2, 1.8],
            handle_rotation_degrees: [Number(angleMinInput.value), Number(angleMaxInput.value)],
            handle_length_px: [Number(handleLengthMinInput.value), Number(handleLengthMaxInput.value)],
            point_y_shift_px: [Number(yShiftMinInput.value), Number(yShiftMaxInput.value)],
            angle_smoothing_weights: [1, 2, 1],
            centering_samples_per_segment: 64
          },
          serial: {
            nine_pulse_height_px: Number(serialMaxHeightInput.value),
            baseline: 'main_curve_center_plus_offset_plus_serial_run_y_shift',
            baseline_offset_px: serialBaselineOffset,
            width_weight_range: [Number(serialWidthWeightMinInput.value), Number(serialWidthWeightMaxInput.value)],
            width_weight_scope: 'whole_handle',
            digit_spacing: 'one_shared_normalized_spacing',
            pulse_handle_spacing_factor: .28,
            transition_weight_factor: .6
          },
          gr0k: {
            raw: Number(gr0kNumberInput.value),
            rotation_max_degrees: Number(gr0kRotationInput.value),
            handle_length_max_ratio: Number(gr0kHandleLengthInput.value) / 100,
            character_y_max_px: Number(gr0kCharacterYInput.value),
            gap_weight_max_ratio: Number(gr0kGapInput.value) / 100,
            serial_y_max_px: Number(gr0kSerialYInput.value),
            serial_width_max_ratio: Number(gr0kSerialWidthInput.value) / 100,
            serial_height_max_ratio: Number(gr0kSerialHeightInput.value) / 100
          },
          stroke: {
            base_weight_px: Number(weightInput.value),
            uppercase_extra_weight_px: Number(uppercaseWeightInput.value),
            underscore_max_weight_px: .15,
            weight_easing: 'smoothstep'
          },
          path: {
            mode,
            coordinate_decimals: 2,
            sampled_outline_target_samples: 240,
            sampled_outline_min_samples_per_segment: 8,
            sampled_outline_max_samples_per_segment: 32
          },
          render: {
            canonical_format: 'svg',
            preview_format: 'png',
            preview_width: 420,
            preview_height: 420,
            preview_is_canonical: false
          }
        };
      }

      function pointsForSettings(sourceText, settings) {
        const geometry = settings.geometry;
        const serial = settings.serial;
        return geometryFor(
          graphemes(sourceText),
          geometry.point_distribution,
          geometry.handle_rotation_degrees[0],
          geometry.handle_rotation_degrees[1],
          geometry.handle_length_px[0],
          geometry.handle_length_px[1],
          geometry.point_y_shift_px[0],
          geometry.point_y_shift_px[1],
          geometry.random_point_height,
          serial.nine_pulse_height_px,
          serial.width_weight_range[0],
          serial.width_weight_range[1],
          settings.gr0k.raw,
          {
            rotationDegrees: settings.gr0k.rotation_max_degrees,
            handleLengthRatio: settings.gr0k.handle_length_max_ratio,
            characterYPx: settings.gr0k.character_y_max_px,
            gapRatio: settings.gr0k.gap_weight_max_ratio,
            serialYPx: settings.gr0k.serial_y_max_px,
            serialWidthRatio: settings.gr0k.serial_width_max_ratio,
            serialHeightRatio: settings.gr0k.serial_height_max_ratio
          }
        );
      }

      function escapeXml(value) {
        return String(value)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#x27;');
      }

      function xmlNumber(value) {
        return Number.isInteger(Number(value)) ? String(Math.trunc(Number(value))) : String(Number(value));
      }

      function canonicalSvgForText(sourceText, settings) {
        const points = pointsForSettings(sourceText, settings);
        const mode = settings.path.mode;
        const weight = settings.stroke.base_weight_px;
        const uppercaseExtra = settings.stroke.uppercase_extra_weight_px;
        let centeredPoints;
        let pathData;
        let pathElement;

        if (mode === 'pure_cubic_bezier_stroke') {
          centeredPoints = centerPointsForCenterline(points);
          pathData = pureBezierPath(centeredPoints);
          pathElement = `<path d="${pathData}" fill="none" stroke="${settings.canvas.ink}" stroke-width="${xmlNumber(weight)}" stroke-linecap="round" stroke-linejoin="round"/>`;
        } else {
          centeredPoints = centerPointsForOutline(points, weight, uppercaseExtra);
          pathData = mode === 'variable_bezier_outline'
            ? bezierVariableWidthPath(centeredPoints, weight, uppercaseExtra)
            : sampledVariableWidthPath(centeredPoints, weight, uppercaseExtra);
          pathElement = `<path d="${pathData}" fill="${settings.canvas.ink}" stroke="none"/>`;
        }

        const canvas = settings.canvas;
        const canvasText = canvas.text;
        const displayedHandle = settings.input.display_prefix + sourceText;
        const textElement = `<text x="${xmlNumber(canvasText.x)}" y="${xmlNumber(canvasText.y)}" font-size="${xmlNumber(canvasText.size_px)}" font-weight="${xmlNumber(canvasText.weight)}" dominant-baseline="${canvasText.dominant_baseline}" fill="${canvas.ink}" text-anchor="${canvasText.anchor}" font-family="${escapeXml(canvasText.font_family)}">${escapeXml(displayedHandle)}</text>`;
        const svg = `<svg viewBox="0 0 ${xmlNumber(canvas.width)} ${xmlNumber(canvas.height)}" xmlns="http://www.w3.org/2000/svg" width="${xmlNumber(canvas.width)}" height="${xmlNumber(canvas.height)}"><rect x="0" y="0" width="${xmlNumber(canvas.width)}" height="${xmlNumber(canvas.height)}" fill="${canvas.background}"/>${pathElement}${textElement}</svg>`;
        return {
          svg,
          metadata: {
            handle: sourceText,
            displayed_handle: displayedHandle,
            character_count: graphemes(sourceText).length,
            anchor_count: centeredPoints.length,
            curve_count: centeredPoints.length - 1,
            path_mode: mode
          }
        };
      }

      function standaloneFinalSvg() {
        return canonicalSvgForText(currentText, currentSettings()).svg;
      }

      function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        root.appendChild(textarea);
        textarea.select();
        const copied = document.execCommand('copy');
        textarea.remove();
        if (!copied) throw new Error('Copy command was rejected');
      }

      async function writeClipboard(text) {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          fallbackCopy(text);
        }
      }

      async function copyWithFeedback(button, text, successText, resetText) {
        try {
          await writeClipboard(text);
          button.textContent = successText;
        } catch (error) {
          try {
            fallbackCopy(text);
            button.textContent = successText;
          } catch (fallbackError) {
            button.textContent = 'Copy failed';
          }
        }
        window.setTimeout(() => {
          button.textContent = resetText;
        }, 1600);
      }

      async function copyFinalSvg() {
        await copyWithFeedback(copySvgButton, standaloneFinalSvg(), 'Copied SVG code', 'Copy 01 SVG code');
      }

      function updateDualRange(track, minimumInput, maximumInput) {
        const domainMinimum = Number(minimumInput.min);
        const domainMaximum = Number(minimumInput.max);
        const span = domainMaximum - domainMinimum;
        const start = (Number(minimumInput.value) - domainMinimum) / span * 100;
        const end = (Number(maximumInput.value) - domainMinimum) / span * 100;
        track.style.setProperty('--range-start', `${start}%`);
        track.style.setProperty('--range-end', `${end}%`);
        track.style.setProperty('--range-mid', `${(start + end) / 2}%`);
      }

      function formatDegrees(value) {
        return `${value < 0 ? '−' : ''}${Math.abs(value)}°`;
      }

      function formatSigned(value) {
        return `${value < 0 ? '−' : ''}${Math.abs(value)}`;
      }

      function draw() {
        const distribution = randomDistributionEnabled ? 'random' : 'average';
        const renderMode = pathModeSelect.value;
        const weight = Number(weightInput.value);
        const rotationMin = Number(angleMinInput.value);
        const rotationMax = Number(angleMaxInput.value);
        const handleLengthMin = Number(handleLengthMinInput.value);
        const handleLengthMax = Number(handleLengthMaxInput.value);
        const yShiftMin = Number(yShiftMinInput.value);
        const yShiftMax = Number(yShiftMaxInput.value);
        const serialMaxHeight = Number(serialMaxHeightInput.value);
        const serialWidthWeightMin = Number(serialWidthWeightMinInput.value);
        const serialWidthWeightMax = Number(serialWidthWeightMaxInput.value);
        const uppercaseExtra = Number(uppercaseWeightInput.value);
        const textSize = Number(textSizeInput.value);
        const textWeight = Number(textWeightInput.value);
        const gr0kRaw = Number(gr0kNumberInput.value);
        const variation = {
          rotationDegrees: Number(gr0kRotationInput.value),
          handleLengthRatio: Number(gr0kHandleLengthInput.value) / 100,
          characterYPx: Number(gr0kCharacterYInput.value),
          gapRatio: Number(gr0kGapInput.value) / 100,
          serialYPx: Number(gr0kSerialYInput.value),
          serialWidthRatio: Number(gr0kSerialWidthInput.value) / 100,
          serialHeightRatio: Number(gr0kSerialHeightInput.value) / 100
        };
        const firstCharacters = graphemes(currentText);
        const firstPoints = geometryFor(firstCharacters, distribution, rotationMin, rotationMax, handleLengthMin, handleLengthMax, yShiftMin, yShiftMax, randomHeightEnabled, serialMaxHeight, serialWidthWeightMin, serialWidthWeightMax, gr0kRaw, variation);
        const curveCount = firstPoints.length < 2 ? 0 : firstPoints.length - 1;

        textOutput.value = `${firstCharacters.length} character${firstCharacters.length === 1 ? '' : 's'}`;
        weightOutput.value = `${weight.toFixed(1)} px`;
        angleOutput.value = `${formatDegrees(rotationMin)} — ${formatDegrees(rotationMax)}`;
        handleLengthOutput.value = `${handleLengthMin} — ${handleLengthMax} px`;
        yShiftOutput.value = `${formatSigned(yShiftMin)} — ${formatSigned(yShiftMax)} px`;
        serialMaxHeightOutput.value = `${serialMaxHeight} px`;
        serialWidthWeightOutput.value = `${serialWidthWeightMin.toFixed(1)}× — ${serialWidthWeightMax.toFixed(1)}×`;
        updateDualRange(angleRange, angleMinInput, angleMaxInput);
        updateDualRange(handleLengthRange, handleLengthMinInput, handleLengthMaxInput);
        updateDualRange(yShiftRange, yShiftMinInput, yShiftMaxInput);
        updateDualRange(serialWidthWeightRange, serialWidthWeightMinInput, serialWidthWeightMaxInput);
        uppercaseWeightOutput.value = `${uppercaseExtra} px`;
        textSizeOutput.value = `${textSize} px`;
        textWeightOutput.value = `${textWeight}`;
        gr0kRawInput.value = String(gr0kRaw);
        gr0kNumberInput.value = String(gr0kRaw);
        gr0kOutput.value = `${gr0kRaw}`;
        gr0kRotationOutput.value = `${variation.rotationDegrees}°`;
        gr0kHandleLengthOutput.value = `${Math.round(variation.handleLengthRatio * 100)}%`;
        gr0kCharacterYOutput.value = `${variation.characterYPx} px`;
        gr0kGapOutput.value = `${Math.round(variation.gapRatio * 100)}%`;
        gr0kSerialYOutput.value = `${variation.serialYPx} px`;
        gr0kSerialWidthOutput.value = `${Math.round(variation.serialWidthRatio * 100)}%`;
        gr0kSerialHeightOutput.value = `${Math.round(variation.serialHeightRatio * 100)}%`;
        distributionToggleButton.textContent = randomDistributionEnabled ? 'On' : 'Off';
        distributionToggleButton.setAttribute('aria-pressed', String(randomDistributionEnabled));
        heightToggleButton.textContent = randomHeightEnabled ? 'On' : 'Off';
        heightToggleButton.setAttribute('aria-pressed', String(randomHeightEnabled));
        uppercaseWeightInput.disabled = renderMode === 'pure-bezier';
        const heightState = randomHeightEnabled
          ? `canonical PRNG Y ${formatSigned(yShiftMin)}—${formatSigned(yShiftMax)} px + gr0k Y`
          : `centered Y + gr0k shift up to ${variation.characterYPx} px`;
        const modeState = renderMode === 'pure-bezier'
          ? `pure cubic Bézier · uniform ${weight.toFixed(1)} px stroke`
          : renderMode === 'outline-bezier'
            ? 'variable-width Bézier outline'
            : 'variable-width sampled outline';
        stateOutput.textContent = firstPoints.length < 2
          ? `01: ${firstCharacters.length} characters / need at least 2 anchors · gr0k ${gr0kRaw}`
          : `01: ${firstCharacters.length} characters / ${firstPoints.length} anchors / ${curveCount} curve${curveCount === 1 ? '' : 's'} · ${modeState} · ${heightState} · gr0k seed ${gr0kRaw} · independent shifts`;

        caption.textContent = `@${currentText}`;
        finalSvg.setAttribute('aria-label', `Black text-seeded open Bezier line for @${currentText} with gr0k seed ${gr0kRaw} on an eggshell background`);
        drawFinal(finalSvg, firstPoints, weight, uppercaseExtra, renderMode, currentText, textSize, textWeight);
      }

      textInput.addEventListener('input', () => {
        const candidate = textInput.value;
        const valid = handlePattern.test(candidate);
        textInput.setCustomValidity(valid ? '' : 'Use 1–15 letters, numbers, or underscores. Do not include @.');
        textInput.setAttribute('aria-invalid', String(!valid));
        textError.hidden = valid;
        if (!valid) {
          textOutput.value = candidate.length === 0 ? '1–15 characters' : 'Invalid handle';
          return;
        }
        currentText = candidate;
        draw();
      });
      distributionToggleButton.addEventListener('click', () => {
        randomDistributionEnabled = !randomDistributionEnabled;
        draw();
      });
      heightToggleButton.addEventListener('click', () => {
        randomHeightEnabled = !randomHeightEnabled;
        draw();
      });
      pathModeSelect.addEventListener('change', draw);
      switchButton.addEventListener('click', () => {
        currentText = validPresets[presetCursor % validPresets.length];
        presetCursor = (presetCursor + 1) % validPresets.length;
        textInput.value = currentText;
        textInput.setCustomValidity('');
        textInput.setAttribute('aria-invalid', 'false');
        textError.hidden = true;
        draw();
      });
      changeGr0kButton.addEventListener('click', () => {
        const randomValue = new Uint32Array(1);
        let nextValue;
        do {
          crypto.getRandomValues(randomValue);
          nextValue = randomValue[0] % 1025;
        } while (nextValue === Number(gr0kNumberInput.value));
        gr0kNumberInput.value = String(nextValue);
        draw();
      });
      gr0kRawInput.addEventListener('input', () => {
        gr0kNumberInput.value = gr0kRawInput.value;
        draw();
      });
      gr0kNumberInput.addEventListener('input', () => {
        if (gr0kNumberInput.value === '') return;
        const value = Math.max(0, Math.min(1024, Math.round(Number(gr0kNumberInput.value))));
        gr0kNumberInput.value = String(value);
        draw();
      });
      [
        gr0kRotationInput,
        gr0kHandleLengthInput,
        gr0kCharacterYInput,
        gr0kGapInput,
        gr0kSerialYInput,
        gr0kSerialWidthInput,
        gr0kSerialHeightInput
      ].forEach(control => control.addEventListener('input', draw));
      copySvgButton.addEventListener('click', copyFinalSvg);
      angleMinInput.addEventListener('input', () => {
        if (Number(angleMinInput.value) > Number(angleMaxInput.value)) angleMinInput.value = angleMaxInput.value;
        draw();
      });
      angleMaxInput.addEventListener('input', () => {
        if (Number(angleMaxInput.value) < Number(angleMinInput.value)) angleMaxInput.value = angleMinInput.value;
        draw();
      });
      handleLengthMinInput.addEventListener('input', () => {
        if (Number(handleLengthMinInput.value) > Number(handleLengthMaxInput.value)) handleLengthMinInput.value = handleLengthMaxInput.value;
        draw();
      });
      handleLengthMaxInput.addEventListener('input', () => {
        if (Number(handleLengthMaxInput.value) < Number(handleLengthMinInput.value)) handleLengthMaxInput.value = handleLengthMinInput.value;
        draw();
      });
      yShiftMinInput.addEventListener('input', () => {
        if (Number(yShiftMinInput.value) > Number(yShiftMaxInput.value)) yShiftMinInput.value = yShiftMaxInput.value;
        draw();
      });
      yShiftMaxInput.addEventListener('input', () => {
        if (Number(yShiftMaxInput.value) < Number(yShiftMinInput.value)) yShiftMaxInput.value = yShiftMinInput.value;
        draw();
      });
      serialWidthWeightMinInput.addEventListener('input', () => {
        if (Number(serialWidthWeightMinInput.value) > Number(serialWidthWeightMaxInput.value)) serialWidthWeightMinInput.value = serialWidthWeightMaxInput.value;
        draw();
      });
      serialWidthWeightMaxInput.addEventListener('input', () => {
        if (Number(serialWidthWeightMaxInput.value) < Number(serialWidthWeightMinInput.value)) serialWidthWeightMaxInput.value = serialWidthWeightMinInput.value;
        draw();
      });
      [weightInput, serialMaxHeightInput, uppercaseWeightInput, textSizeInput, textWeightInput].forEach(control => control.addEventListener('input', draw));
      const signatureFieldApi = {
        canonicalSvgForText,
        generateSvgForText: canonicalSvgForText,
        currentSettings
      };
      root.__signatureField = signatureFieldApi;
      root.__personalField = signatureFieldApi;
      draw();
    })();
  </script>
</div>
