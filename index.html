  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

        const smoothedAngles = smoothedHandleAngles(raw);
        const lineStart = 60;
        const lineEnd = 360;
        const lineSpan = lineEnd - lineStart;
        const targetSpan = count &lt;= 3 ? lineSpan * count / 4 : lineSpan;
        const targetStart = center - targetSpan / 2;
        const targetEnd = center + targetSpan / 2;

        const identityPoint = (character, index, x) =&gt; {
          const yShift = (useRandomHeight ? raw[index].canonicalYShift : 0) + raw[index].gr0kYShift;
          const anchor = [x, center + yShift];
          const angle = smoothedAngles[index];
          const direction = [Math.cos(angle), Math.sin(angle)];
          return {
            character,
            uppercase: isUppercase(character),
            serialTail: false,
            anchor,
            incoming: [anchor[0] - direction[0] * raw[index].incomingLength, anchor[1] - direction[1] * raw[index].incomingLength],
            outgoing: [anchor[0] + direction[0] * raw[index].outgoingLength, anchor[1] + direction[1] * raw[index].outgoingLength]
          };
        };

        const centerGeometry = points =&gt; {
          const xValues = points.flatMap(point =&gt; [point.anchor[0], point.incoming[0], point.outgoing[0]]);
          const geometryCenter = (Math.min(...xValues) + Math.max(...xValues)) / 2;
          const shiftX = center - geometryCenter;
          return points.map(point =&gt; ({
            ...point,
            anchor: [point.anchor[0] + shiftX, point.anchor[1]],
            incoming: [point.incoming[0] + shiftX, point.incoming[1]],
            outgoing: [point.outgoing[0] + shiftX, point.outgoing[1]]
          }));
        };

        if (!hasSerialDigits) {
          if (count === 1) {
            return centerGeometry([
              identityPoint(characters[0], 0, targetStart),
              identityPoint(characters[0], 0, targetEnd)
            ]);
          }
          const gapWeights = characters.slice(0, count - 1).map((character, index) =&gt; (
            pairGapWeight(character, characters[index + 1], distribution !== &#x27;average&#x27;, gr0kRaw, variation)
          ));
          const gapTotal = gapWeights.reduce((total, value) =&gt; total + value, 0);
          const gaps = gapWeights.map(value =&gt; targetSpan * value / gapTotal);
          const positions = [targetStart];
          gaps.forEach(gap =&gt; positions.push(positions[positions.length - 1] + gap));
          return centerGeometry(characters.map((character, index) =&gt; identityPoint(character, index, positions[index])));
        }

        const serialRunYShifts = new Map();
        for (let index = 0; index &lt; count;) {
          if (!serialFlags[index]) {
            index++;
            continue;
          }
          let endIndex = index + 1;
          while (endIndex &lt; count &amp;&amp; serialFlags[endIndex]) endIndex++;
          const runValue = characters.slice(index, endIndex).join(&#x27;&#x27;);
          const runScope = { kind: &#x27;x-handle-serial-run&#x27;, value: runValue };
          const canonicalRunShift = useRandomHeight
            ? mapRange(hashToUnitFloat(runScope, &#x27;point-y-shift&#x27;), yShiftMin, yShiftMax)
            : 0;
          const runShift = canonicalRunShift
            + variantSigned(runScope, &#x27;point-y-shift&#x27;, gr0kRaw) * variation.serialYPx;
          for (let runIndex = index; runIndex &lt; endIndex; runIndex++) {
            serialRunYShifts.set(runIndex, runShift);
          }
          index = endIndex;
        }

        const serialPoint = (character, x, y, incomingHandle, outgoingHandle) =&gt; ({
          character,
          uppercase: false,
          serialTail: true,
          anchor: [x, y],
          incoming: [x - incomingHandle, y],
          outgoing: [x + outgoingHandle, y]
        });

        const flexibleBoundaries = [];
        const transitionBoundaries = [];
        for (let index = 0; index &lt; count - 1; index++) {
          if (serialFlags[index] !== serialFlags[index + 1]) transitionBoundaries.push(index);
          if (!serialFlags[index] &amp;&amp; !serialFlags[index + 1]) flexibleBoundaries.push(index);
        }

        const flexibleWeights = flexibleBoundaries.map(index =&gt; (
          pairGapWeight(characters[index], characters[index + 1], distribution !== &#x27;average&#x27;, gr0kRaw, variation)
        ));
        const handleScope = { kind: &#x27;x-handle&#x27;, value: characters.join(&#x27;&#x27;) };
        const serialWidthWeight = mapRange(
          hashToUnitFloat(handleScope, &#x27;serial-width-weight&#x27;),
          serialWidthWeightMin,
          serialWidthWeightMax
        ) * (1 + variantSigned(handleScope, &#x27;serial-width-weight&#x27;, gr0kRaw) * variation.serialWidthRatio);
        const variantSerialMaxHeight = serialMaxHeight
          * (1 + variantSigned(handleScope, &#x27;serial-pulse-height&#x27;, gr0kRaw) * variation.serialHeightRatio);
        const transitionWeight = serialWidthWeight * .6;
        const flexibleTotal = flexibleWeights.reduce((total, value) =&gt; total + value, 0);
        const layoutWeightTotal = serialDigitCount * serialWidthWeight
          + transitionBoundaries.length * transitionWeight
          + flexibleTotal;
        const layoutScale = layoutWeightTotal &gt; 0 ? targetSpan / layoutWeightTotal : 0;
        const serialSpacing = serialDigitCount === count
          ? targetSpan / serialDigitCount
          : serialWidthWeight * layoutScale;
        const transitionGap = transitionWeight * layoutScale;
        const flexibleAdvance = new Map(flexibleBoundaries.map((index, weightIndex) =&gt; [
          index,
          flexibleWeights[weightIndex] * layoutScale

        const points = [];

        characters.forEach((character, index) =&gt; {

            points.push(serialPoint(character, cursorX + serialSpacing / 2, serialRunBaselineY - pulseHeight, pulseHandle, pulseHandle));
            cursorX += serialSpacing;
            points.push(serialPoint(character, cursorX, serialRunBaselineY, pulseHandle, pulseHandle));
            if (index &lt; count - 1 &amp;&amp; !serialFlags[index + 1]) cursorX += transitionGap;
          } else {
            points.push(identityPoint(character, index, cursorX));
            if (index &lt; count - 1) {
              cursorX += serialFlags[index + 1] ? transitionGap : flexibleAdvance.get(index) || 0;
            }

        return centerGeometry(points);

      function cubicPoint(p0, p1, p2, p3, t) {
        const u = 1 - t;
        const a = u * u * u;
        const b = 3 * u * u * t;
        const c = 3 * u * t * t;
        const d = t * t * t;
        return [
          a * p0[0] + b * p1[0] + c * p2[0] + d * p3[0],
          a * p0[1] + b * p1[1] + c * p2[1] + d * p3[1]

          3 * u * u * (p1[1] - p0[1]) + 6 * u * t * (p2[1] - p1[1]) + 3 * t * t * (p3[1] - p2[1])

        const length = Math.hypot(derivative[0], derivative[1]) || 1;

          position[1] + normal[1] * halfWidth * side

            const inner = offsetPoint(current, next, t, -1, baseWeight, uppercaseExtra);

            maximumX = Math.max(maximumX, outer[0], inner[0]);

          anchor: [point.anchor[0] + shiftX, point.anchor[1]],
          incoming: [point.incoming[0] + shiftX, point.incoming[1]],
          outgoing: [point.outgoing[0] + shiftX, point.outgoing[1]]

        let maximumX = -Infinity;

          const next = points[index + 1];

            const position = cubicPoint(current.anchor, current.outgoing, next.incoming, next.anchor, sample / samples);
            minimumX = Math.min(minimumX, position[0]);
            maximumX = Math.max(maximumX, position[0]);

          ...point,
          anchor: [point.anchor[0] + shiftX, point.anchor[1]],
          incoming: [point.incoming[0] + shiftX, point.incoming[1]],
          outgoing: [point.outgoing[0] + shiftX, point.outgoing[1]]

          const endWeight = weightAt(next, baseWeight, uppercaseExtra);

        const next = points[points.length - 1];
        sampleSegment(current, next, 1, weightAt(current, baseWeight, uppercaseExtra), weightAt(next, baseWeight, uppercaseExtra));
        return `M${outer.map(pair).join(&#x27;L&#x27;)}L${inner.reverse().map(pair).join(&#x27;L&#x27;)}Z`;

          27 * oneThird[1] - 8 * start[1] - end[1]

          27 * twoThirds[1] - start[1] - 8 * end[1]

      function bezierVariableWidthPath(points, baseWeight, uppercaseExtra) {
        if (points.length &lt; 2) return &#x27;&#x27;;
        const lastSegment = points.length - 2;
        const firstOuter = offsetPoint(points[0], points[1], 0, 1, baseWeight, uppercaseExtra);
        let path = `M${pair(firstOuter)}`;

        for (let index = 0; index &lt;= lastSegment; index++) {
          const current = points[index];
          const next = points[index + 1];
          const start = offsetPoint(current, next, 0, 1, baseWeight, uppercaseExtra);
          const oneThird = offsetPoint(current, next, 1 / 3, 1, baseWeight, uppercaseExtra);
          const twoThirds = offsetPoint(current, next, 2 / 3, 1, baseWeight, uppercaseExtra);
          const end = offsetPoint(current, next, 1, 1, baseWeight, uppercaseExtra);
          const controls = cubicThroughThirds(start, oneThird, twoThirds, end);
          path += `C${pair(controls.control1)} ${pair(controls.control2)} ${pair(end)}`;
        }

        const finalInner = offsetPoint(points[lastSegment], points[lastSegment + 1], 1, -1, baseWeight, uppercaseExtra);
        path += `L${pair(finalInner)}`;

        for (let index = lastSegment; index &gt;= 0; index--) {
          const current = points[index];
          const next = points[index + 1];
          const start = offsetPoint(current, next, 0, -1, baseWeight, uppercaseExtra);
          const oneThird = offsetPoint(current, next, 1 / 3, -1, baseWeight, uppercaseExtra);
          const twoThirds = offsetPoint(current, next, 2 / 3, -1, baseWeight, uppercaseExtra);
          const end = offsetPoint(current, next, 1, -1, baseWeight, uppercaseExtra);
          const controls = cubicThroughThirds(start, oneThird, twoThirds, end);
          path += `C${pair(controls.control2)} ${pair(controls.control1)} ${pair(start)}`;
        }

        return `${path}Z`;
      }

      function variableWidthPath(points, baseWeight, uppercaseExtra, pathMode) {
        return pathMode === &#x27;bezier&#x27;
          ? bezierVariableWidthPath(points, baseWeight, uppercaseExtra)
          : sampledVariableWidthPath(points, baseWeight, uppercaseExtra);

        let path = `M${pair(points[0].anchor)}`;
        for (let index = 0; index &lt; points.length - 1; index++) {

          const next = points[index + 1];
          path += `C${pair(current.outgoing)} ${pair(next.incoming)} ${pair(next.anchor)}`;
        }

      function addBackground(svg) {

            height: 420,
            background: &#x27;#f2ead6&#x27;,
            ink: &#x27;#11110f&#x27;,
            text: {

              y: 399,
              size_px: Number(textSizeInput.value),
              weight: Number(textWeightInput.value),
              anchor: &#x27;middle&#x27;,
              dominant_baseline: &#x27;middle&#x27;,
              font_family: &#x27;-apple-system, system-ui, Segoe UI, sans-serif&#x27;

            random_point_height: randomHeightEnabled,

          geometry.handle_rotation_degrees[1],
          geometry.handle_length_px[0],
          geometry.handle_length_px[1],
          geometry.legacy_random_point_y_shift_px[0],
          geometry.legacy_random_point_y_shift_px[1],
